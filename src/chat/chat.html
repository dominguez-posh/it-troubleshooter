<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>IT-Troubleshooter Mini-Fenster</title>
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="../ui/base.css" />
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <header id="title" class="title">
      <span class="name">Mini-Fenster</span>
      <span class="btns">
        <button id="b-hist" class="btn small" type="button" aria-expanded="false" title="Zeigt den Verlauf und weitere Optionen">Mehr</button>
        <button id="b-close" class="btn small" type="button" title="Schließt dieses Fenster. Der Fall läuft weiter.">Schließen</button>
      </span>
    </header>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <main id="card" class="hero" aria-live="polite"></main>
    <form id="form" class="form">
      <label class="sr" for="input">Notiz oder Info für die KI</label>
      <textarea id="input" rows="1" maxlength="1000" placeholder="Notiz oder Info für die KI"></textarea>
      <button id="send" class="btn" type="submit">Senden</button>
    </form>
    <section id="hist" class="hist" hidden>
      <button id="b-call" class="btn small" type="button" title="Startet ein Telefonat: Du bekommst sofort Fragen für den Kunden.">Telefonat mit Kunden</button>
      <label class="check"><input id="reeval" type="checkbox" /> Neue Notizen sofort berücksichtigen</label>
      <h3>Verlauf</h3>
      <div id="hist-list"></div>
      <p class="hint">Fenster bewegen: Alt+Pfeiltasten. Größe ändern: Alt+Umschalt+Pfeiltasten.</p>
    </section>
    <script src="chat.js"></script>
  </body>
</html>
